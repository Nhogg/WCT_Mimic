[project]
name = "wct2g1"
version = "0.1.0"
description = "World Chase Tag footage -> Unitree G1 tracking motions (research, non-commercial)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "pyyaml"]

[project.scripts]
wct2g1 = "wct2g1.cli:main"

[tool.setuptools.packages.find]
include = ["wct2g1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
