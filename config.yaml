# wct2g1 pipeline configuration. Every path, threshold and URL lives here.
# Relative paths resolve against the repo root (the directory holding this file).

seed: 0

paths:
  data: data
  raw: data/raw
  shots: data/shots
  tracks: data/tracks
  smpl: data/smpl
  clean: data/clean
  g1: data/g1
  policies: data/policies
  final_dataset: data/final_dataset
  manifests: data/manifests
  review: review
  models: data/models
  # SMPL/SMPL-X body models (licensed; download by hand). Layout:
  #   smplx/SMPLX_NEUTRAL.npz  smplx/SMPLX_NEUTRAL.pkl   (SMPL-X v1.1, used by GVHMR + GMR)
  #   smpl/SMPL_NEUTRAL.pkl                           (SMPL v1.1, GVHMR rendering)
  body_models: data/models/body_models
  logs: data/logs

# Conda env used for each stage (scripts/run_stage.sh reads this).
envs:
  acquire: wct-data
  segment: wct-data
  track: wct-data
  reconstruct: gvhmr
  clean: wct-data
  retarget: gmr
  train_filter: mjlab
  obstacles: wct-data
  generalist_train: mjlab
  generalist_eval: mjlab
  report: wct-data

acquire:
  # World Chase Tag channel or playlist URLs. Non-commercial research use only.
  sources: []
  #  - https://www.youtube.com/@WorldChaseTag/videos
  ytdlp_bin: yt-dlp
  # Prefer 50/60 fps, then H.264 (AV1/VP9 decode support varies across the stage envs).
  format: "bv*[height<=1080][fps>=50][vcodec^=avc1]+ba/bv*[height<=1080][fps>=50]+ba/bv*[height<=1080][vcodec^=avc1]+ba/bv*[height<=1080]+ba/b"
  merge_output_format: mp4
  output_template: "%(id)s/%(id)s.%(ext)s"   # relative to paths.raw
  archive_file: archive.txt                  # relative to paths.raw
  sleep_interval_s: 5
  max_sleep_interval_s: 15
  match_filters: []      # e.g. ["upload_date>=20240101", "title~='(?i)world championship'"]
  video_url_template: "https://www.youtube.com/watch?v={id}"   # used with --ids
  extra_args: []

segment:
  detector:              # PySceneDetect AdaptiveDetector
    adaptive_threshold: 3.0
    min_scene_len_frames: 15
    window_width: 2
    min_content_val: 15.0
  min_shot_s: 1.0        # shorter -> rejected
  max_shot_s: 40.0       # longer -> kept but flagged for review (probably not one chase)
  clip:
    model: ViT-L-14
    pretrained: openai
    device: auto         # auto | cpu | cuda
    samples_per_shot: 3  # frames sampled evenly inside the shot
    keep_threshold: 0.5  # summed softmax prob of keep prompts, averaged over samples
    keep_prompts:
      - wide shot of athletes running on an indoor obstacle course
      - slow motion replay of an athlete vaulting
    drop_prompts:
      - close-up of a person's face
      - crowd in stands
      - scoreboard graphic
      - commentators at a desk
  slowmo:
    prompts:             # [slow-motion, real-time]; prob of the first is used
      - slow motion replay of an athlete
      - real-time sports footage of an athlete
    prob_min: 0.5
    flow_pairs: 8        # consecutive frame pairs sampled per shot for optical flow
    flow_width: 320      # frames resized to this width for flow
    neighbours: 3        # shots each side used as the flow reference
    flow_ratio_max: 0.5  # shot flow / median neighbour flow below this -> slow-mo
  cut:
    vcodec: libx264
    crf: 16
    preset: fast
  review:
    sample_n: 50
    reject_sample_n: 20  # also show some rejected shots, to sanity-check recall
    thumb_width: 320

track:
  model: yolo26x.pt        # ultralytics weights; auto-downloaded
  imgsz: 1280              # inference size; runners are often small in wide shots
  conf: 0.25
  device: auto             # auto | cpu | 0
  tracker:                 # overrides on ultralytics' botsort.yaml defaults
    tracker_type: botsort
    track_high_thresh: 0.25
    track_low_thresh: 0.1
    new_track_thresh: 0.25
    track_buffer: 50       # frames (~1 s at 50 fps) a lost track stays alive
    match_thresh: 0.8
    fuse_score: true
    gmc_method: sparseOptFlow   # compensates broadcast camera pans
    proximity_thresh: 0.5
    appearance_thresh: 0.8
    with_reid: true
    model: auto            # ReID from detector features
  stitch:
    max_gap_s: 0.5         # join tracklets of one person split by occlusion
    iou_min: 0.3           # boxes overlap enough ...
    max_center_dist_h: 0.75   # ... or centres within this many box heights
    max_height_ratio: 1.4     # and box heights within this ratio
  select:
    max_tracks: 2
    min_coverage: 0.7      # visible in >= 70% of the shot's frames
    min_median_box_h: 0.15 # median box height >= 15% of frame height
    max_truncated_frac: 0.5   # box touching top/bottom edge (body cut off) in at most this share of frames
    edge_margin_px: 2
    min_dur_s: 1.5         # after stitching
    # rank = coverage + w_height * median_box_h + w_motion * (box heights moved per second)
    w_height: 1.0
    w_motion: 0.5
  smooth:
    savgol_window_s: 0.25
    savgol_polyorder: 2
  review:
    sample_n: 10           # shots that get an overlay video (plus any --ids)
    overlay_width: 960

reconstruct:
  gvhmr_root: third_party/GVHMR
  checkpoints: data/models/gvhmr/checkpoints   # linked to <gvhmr_root>/inputs/checkpoints
  # GVHMR is trained at 30 fps and predicts per-frame motion, so by default frames are
  # resampled to 30 fps before inference. "native" runs every frame (spec's original plan).
  input_fps: 30            # target; actual = src_fps / integer stride (50 -> 25), or "native"
  f_mm: null               # full-frame focal length guess; null = GVHMR default. Broadcast zoom may need larger.
  vo:                      # camera rotation for moving-camera shots
    backend: simple        # simple (GVHMR SimpleVO, SIFT) | dpvo (unreliable on M1 shot: NaN/implausible; falls back to simple)
    scale: 0.5             # simple: image scale
    step: 8                # simple: frame step
    method: sift           # simple: feature type
    dpvo_resize: 0.5       # dpvo: image scale (GVHMR demo default)
    dpvo_buffer_margin: 32 # dpvo: keyframe buffer = n_frames + margin (demo 4000 preallocates tens of GB)
  bbox_enlarge: 1.2        # GVHMR demo default
  static_shot_ids: []      # shots to run with static-camera mode
  review:
    sample_n: 5            # tracks that get incam + world-view renders (plus any --ids)

clean:
  fps: 50                    # output frame rate
  smooth:
    cutoff_hz: 8.0           # zero-phase Butterworth low-pass on root transl + 6D joint rotations
    order: 4
  ground:
    floor_percentile: 5      # floor = this percentile of per-frame lowest sole height
    mode: rolling            # global (one floor height) | rolling (slowly varying; absorbs GVHMR vertical drift)
    window_s: 1.0            # rolling: window for the percentile and its smoothing
  contact:
    height_m: 0.05           # sole within this of the floor ...
    speed_mps: 0.6           # ... and foot joint slower than this -> in contact
    min_frames: 3            # drop contact blips shorter than this
    z_fix_cutoff_hz: 4.0     # smoothing of the vertical (sole-to-floor) root correction
  reject:
    max_root_speed_mps: 12.0
    max_root_jump_m: 0.5     # between consecutive GVHMR frames (before resampling)
    below_floor_m: 0.03      # sole lower than -this counts as "below floor"
    max_below_floor_frac: 0.2
  cut:
    min_s: 2.0
    max_s: 10.0
    speed_smooth_s: 0.2      # root speed is smoothed before looking for low-velocity cut points
    trim_edges_s: 0.3        # dropped from both ends of each track (reconstruction is worst there)
  obstacle:                  # frames that look like obstacle use (course not in the motion data)
    split: true              # cut clips at obstacle/flat boundaries; else flag whole segments
    hand_height_m: 0.25      # a wrist this close to the floor
    pelvis_rise_m: 0.30      # pelvis this far above its standing height (global floor)
    air_height_m: 0.10       # both soles above the floor by this ...
    airborne_s: 0.5          # ... for longer than this
    margin_s: 0.3            # obstacle frames are dilated by this on each side
  smplx_gender: neutral
  num_betas: 10
  export_num_betas: 16      # AMASS SMPL-X / GMR default; extra coefficients zero-padded

retarget:
  gmr_root: third_party/GMR
  robot: unitree_g1              # GMR target (29-DoF)
  fps: 50
  height_source: measured        # measured (Stage 5 mesh height) | gmr_betas (GMR's 1.66 + 0.1*beta0)
  limit_tol_rad: 0.02            # joint within this of a limit counts as "at limit"
  max_limit_frac: null      # reject above this fraction of frames with any joint at a limit; null = report only
                            # (GMR clamps to limits, so saturation is common; Stage 7 judges feasibility)
  review:
    sample_n: 5                  # clips that get a MuJoCo preview video (plus any --ids)
    width: 640
    height: 480

train_filter:
  # Simulator: mjlab (MuJoCo-Warp) BeyondMimic tracking task, chosen over Isaac Sim (see README).
  base_task: Mjlab-Tracking-Flat-Unitree-G1
  task_id: WCT-Tracking-Flat-G1-SimOnly
  sim_only:
    drop_events: [push_robot, base_com, encoder_bias, foot_friction]   # domain randomization
    obs_corruption: false
    torque_scale: 1.0          # scales every actuator effort limit (1.0 = real G1)
  convert:
    fps: 50                    # our CSVs are 50 fps; mjlab tracking runs at 50 Hz
  filter:
    num_envs: 4096
    max_iterations: 2000
    logger: tensorboard
    rollouts: 20
    video: true              # record env 0 of the evaluation to review/policy_rollouts/<clip>.mp4
    video_size: [960, 540]   # width, height
    accept:
      max_fall_rate: 0.10
      max_mpjpe_m: 0.10
      mpjpe_frame: root_relative   # root_relative (MPJPE as usually defined) | global (mjlab MPKPE, includes path drift)
      min_completion: 0.95

obstacles:
  # Milestone 5: boxes implied by planted feet above the floor (wct2g1.obstacles).
  ground_percentile: 5       # ankle height on the floor = this percentile of the lower foot
  max_foot_speed: 0.4        # m/s; slower counts as planted
  min_stance_s: 0.08
  min_height_m: 0.20         # lower raised stances are mostly floor-estimate error
  merge_dz_m: 0.10           # stances within this height and ...
  merge_dxy_m: 0.30          # ... this distance share one box
  margins_m: [0.20, 0.12, 0.06]   # footprint margin around the planted foot; shrink if the reference passes through
  min_size_m: 0.25           # minimum box footprint side
  penetration_tol_m: 0.05
  step_window_s: 0.25        # stance leg is not checked this long before/after its stance
  max_penetration_frac: 0.05     # tolerate a few frames of reconstruction error

generalist:
  # Milestone 4: one tracking policy for all clips accepted by Stage 7 (sim-only task,
  # multi-clip motion command). Evaluated per clip with train_filter.filter.accept.
  task_id: WCT-Tracking-Multi-Flat-G1-SimOnly
  run_name: v3
  # v1 (current frame only, uniform_ratio 0.1): 54/74 training clips pass, plateaued at
  # ~10k iterations with sampling concentrated on a few bins. v2 adds look-ahead and
  # keeps more of the sampling uniform (66/74). v3 (Milestone 5) adds per-clip obstacle
  # boxes and a height scan; each env tracks one clip.
  future_steps: [2, 5, 10, 25]      # look-ahead offsets in control steps (50 Hz); [] = off
  adaptive_uniform_ratio: 0.5       # mjlab default 0.1
  terrain:                          # Milestone 5
    enabled: true                   # obstacle boxes from wct2g1.obstacles + height scan
    add_obstacle_clips: true        # also train on clips with boxes that Stage 7 rejected on flat ground
    max_boxes: 4                    # box geoms per env (a clip may use fewer)
    scan_size_m: [1.6, 1.0]         # height-scan grid around the pelvis (forward, sideways)
    scan_res_m: 0.1
    scan_max_m: 5.0
  num_envs: 8192
  max_iterations: 30000      # ~0.5-1 s/iteration on one GPU
  hidden_dims: [1024, 512, 256]   # actor and critic (per-clip policies use 512-256-128)
  save_interval: 1000
  bin_s: 1.0                 # adaptive-sampling bin length; bins never span two clips
  logger: tensorboard
  checkpoint: null           # eval: explicit checkpoint path; null = latest in the run dir
  rollouts: 20
  video: true                # review/generalist_rollouts/<run_name>/<clip>.mp4

manifest:
  lock_stale_s: 600          # a manifest lock older than this is treated as abandoned
  lock_poll_s: 0.5

slurm:
  head_host: head
  defaults:
    partition: gpu
    gres: "gpu:1"
    cpus_per_task: 8
    mem: 48G
    time: "04:00:00"
  stages:                  # per-stage overrides of the defaults
    reconstruct:
      gres: "gpu:l40s:1"   # gvhmr env is torch 2.3/cu121: no Blackwell (sm_120) kernels
    generalist_train:
      time: "16:00:00"
